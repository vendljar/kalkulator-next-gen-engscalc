<title>Kokpit dávek KNG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Rozvržení: úzký velín pro postranní okno (~600 px) — čeká na vás, 4 dlaždice větví, řádky dávek, deník */
:root{
  --bg:#f2f4f3; --panel:#ffffff; --fg:#1b2320; --muted:#5f6b65; --line:#d8ddda; --soft:#eef1ef;
  --steel:#2f6475; --ok:#2e7d4f; --warn:#a86200; --bad:#b3261e; --idle:#86918b;
  --okbg:#e2f1e7; --warnbg:#fcefd8; --badbg:#f9e1df; --steelbg:#e0edf1;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --panel:#1b221f; --fg:#e3e9e6; --muted:#9ba8a1; --line:#2e3833; --soft:#222a26;
  --steel:#82b8c8; --ok:#6cc68f; --warn:#e6a64a; --bad:#f08a80; --idle:#7d8983;
  --okbg:#1b3325; --warnbg:#3a2c14; --badbg:#3d1f1c; --steelbg:#1c3139; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --panel:#1b221f; --fg:#e3e9e6; --muted:#9ba8a1; --line:#2e3833; --soft:#222a26;
  --steel:#82b8c8; --ok:#6cc68f; --warn:#e6a64a; --bad:#f08a80; --idle:#7d8983;
  --okbg:#1b3325; --warnbg:#3a2c14; --badbg:#3d1f1c; --steelbg:#1c3139; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:12.5px;line-height:1.4;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:10px 24px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:10px;min-width:0}
h1{font-family:var(--display);font-size:22px;letter-spacing:.02em;margin:0;line-height:1}
h2{font-family:var(--display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;justify-content:space-between}
.stamp{font-family:var(--mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.alert{border-radius:5px;padding:8px 10px;display:grid;gap:4px;border:1px solid var(--warn);background:var(--warnbg)}
.alert.empty{border-color:var(--ok);background:var(--okbg)}
.alert .h{font-weight:600;color:var(--warn)} .alert.empty .h{color:var(--ok)}
.alert ol{margin:0;padding-left:18px;display:grid;gap:3px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 8px;display:grid;gap:1px;min-width:0;border-top:3px solid var(--idle)}
.tile.ok{border-top-color:var(--ok)} .tile.warn{border-top-color:var(--warn)} .tile.run{border-top-color:var(--steel)} .tile.bad{border-top-color:var(--bad)}
.tile .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:19px;line-height:1.05}
.tile .d{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.rows{display:grid;gap:6px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:7px 9px;display:grid;
  grid-template-columns:44px minmax(0,1fr) 86px;gap:2px 10px;align-items:start}
.row .id{font-family:var(--display);font-size:22px;line-height:1;grid-row:span 2}
.row .id small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400;margin-top:3px}
.what{font-weight:600;min-width:0}
.sub{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.right{text-align:right;grid-row:span 2;display:grid;gap:4px;justify-items:end}
.eta{font-family:var(--display);font-size:18px;line-height:1}
.etal{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ctx{width:100%;display:grid;gap:2px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.w{background:var(--warn)} .bar i.b{background:var(--bad)}
.ph{display:flex;align-items:center;gap:8px;min-width:0}
.steps{display:flex;gap:2px;flex:0 0 120px}
.step{flex:1;height:6px;border-radius:1px;background:var(--line)}
.step.done{background:var(--ok)} .step.now{background:var(--steel)} .step.blk{background:var(--warn)}
.stepl{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepl b{color:var(--fg);font-weight:600}
.next{grid-column:2 / 4;font-size:11.5px;border-top:1px dashed var(--line);padding-top:4px;margin-top:2px}
.next b{color:var(--muted);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:10.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:4px;align-items:center}
.legend i{display:inline-block;width:12px;height:6px;border-radius:1px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:5px}
.log table{border-collapse:collapse;width:100%}
.log td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.log tr:last-child td{border-bottom:0}
.log td.cas{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;width:1%}
.done ul{list-style:none;margin:0;padding:0}
.done li{padding:4px 8px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.done li:last-child{border-bottom:0}
.done b{font-family:var(--display);font-size:15px;min-width:22px}
.note{font-size:10.5px;color:var(--muted)}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:38px minmax(0,1fr) 70px}.steps{flex-basis:84px}}
</style>

<div class="wrap">
  <div class="top"><h1>Kokpit dávek KNG</h1><div class="stamp" id="stamp"></div></div>
  <section id="cekani" class="alert"></section>
  <section class="tiles" id="tiles"></section>
  <div class="note" id="releasy"></div>
  <section>
    <div class="top"><h2>Dávky</h2>
      <div class="legend"><span><i style="background:var(--ok)"></i>hotovo</span><span><i style="background:var(--steel)"></i>teď</span><span><i style="background:var(--warn)"></i>čeká</span></div></div>
    <div class="rows" id="board"></div>
    <div class="note">Fáze: kód → testy → mutace → souhrn → integrace → sady → test. Zbývá = odhad koordinace. Kontext = čerpání limitu sezení (nad 60 % žlutě, nad 75 % červeně).</div>
  </section>
  <section><h2>Deník</h2><div class="box log"><table id="log"></table></div></section>
  <section><h2>Hotová sezení</h2><div class="box done"><ul id="hotova"></ul></div></section>
</div>

<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var ctx=function(p){
    if(p==null) return '<div class="ctx"><span class="mono">kontext ?</span><div class="bar"><i style="width:0"></i></div></div>';
    var c=p>=75?'b':(p>=60?'w':'');
    return '<div class="ctx"><span class="mono">kontext '+p+' %</span><div class="bar"><i class="'+c+'" style="width:'+Math.min(p,100)+'%"></i></div></div>'};
  document.getElementById('stamp').textContent=D.aktualizace+' · koordinace kontext '+D.koordinace.kontext+' %';
  var c=document.getElementById('cekani');
  if(D.cekaNaJV.length){c.innerHTML='<div class="h">Čeká na vás</div><ol>'+D.cekaNaJV.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>'}
  else{c.className='alert empty';c.innerHTML='<div class="h">Nic na vás nečeká — koordinace běží sama.</div>'}
  document.getElementById('tiles').innerHTML=D.dlazdice.map(function(t){
    return '<div class="tile '+t.s+'"><div class="k">'+esc(t.k)+'</div><div class="v">'+esc(t.v)+'</div><div class="d">'+esc(t.d)+'</div></div>'}).join('');
  document.getElementById('releasy').innerHTML='<b>Releasy:</b> '+esc(D.releasy||'');
  document.getElementById('board').innerHTML=D.davky.map(function(d){
    var st=D.faze.map(function(f,i){var k=i<d.faze?'done':(i===d.faze?(d.stav==='warn'?'blk':'now'):'');return '<div class="step '+k+'" title="'+esc(f)+'"></div>'}).join('');
    return '<div class="row"><div class="id">'+esc(d.id)+'<small>'+esc(d.verze)+'</small></div>'+
      '<div><div class="what">'+esc(d.co)+'</div><div class="sub mono">'+esc(d.sub)+'</div></div>'+
      '<div class="right"><div><div class="eta">'+esc(d.eta)+'</div><div class="etal">zbývá</div></div>'+ctx(d.kontext)+'</div>'+
      '<div class="ph"><div class="steps">'+st+'</div><div class="stepl">teď: <b>'+esc(D.faze[d.faze]||'hotovo')+'</b> '+Math.min(d.faze+1,D.faze.length)+'/'+D.faze.length+'</div></div>'+
      '<div class="next"><b>Další:</b> '+esc(d.dalsi)+'</div></div>'}).join('');
  document.getElementById('hotova').innerHTML=D.hotova.map(function(h){return '<li><b>'+esc(h[0])+'</b><span>'+esc(h[1])+'</span></li>'}).join('');
  document.getElementById('log').innerHTML=D.log.map(function(r){return '<tr><td class="cas">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>'}).join('');
})();
</script>
