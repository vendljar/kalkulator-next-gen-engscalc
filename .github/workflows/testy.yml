# Testy Kalkulátoru v cloudu (7. 9. 2026)
#
# Proč: na pracovním notebooku nejde z bezpečnostních důvodů instalovat Node
# ani Python, takže sady ze spust_testy.sh tam nikdy nepoběží. Kód už na
# GitHubu je a Netlify ho staví v cloudu — testy tedy běží tamtéž, na
# GitHub Actions, nad týmiž vynulovanými zdrojáky: žádný skutečný ceník
# (sady, které ho potřebují, se přeskočí s kódem 3 stejně jako lokálně),
# žádná tajemství (overit_online.mjs si nastavuje vlastní zkušební).
#
# Spouští se při každém pushi a pull requestu na main/test a ručně
# (GitHub → Actions → Testy → Run workflow). Výsledek: zelená/červená
# u commitu, podrobný výpis v záložce Actions, sestavený dist/ jako
# artefakt ke stažení. Nasazení na Netlify tím NENÍ podmíněné — Netlify
# staví dál sám; tohle je nezávislá kontrola.
name: Testy

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Adresa hlavního správce se od 16. 9. 2026 bere z proměnné prostředí,
    # ne z konstanty v repozitáři (ten je veřejný). Testům stačí SMYŠLENÁ
    # adresa — ověřují pravidla, ne konkrétní účet. Ostrý a testovací web mají
    # svou vlastní nastavenou v Netlify.
    env:
      ADMIN_EMAIL: spravce@priklad.cz
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'   # stejná verze jako NODE_VERSION v netlify.toml

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Konvence vDEN.MĚSÍC.pořadí (10. 9. 2026). Na pracovním notebooku nejde
      # spustit Python, takže se verze.txt píše ručně a pojistka uvnitř build.py
      # se nikdy nespustí — čtyři dávky z 10. září odešly jako 9.9.x. Tenhle
      # krok je ten chybějící článek: měří verzi proti datu posledního commitu.
      - name: Verze odpovídá dni commitu (vDEN.MĚSÍC.pořadí)
        run: python3 build.py --kontrola-verze

      # Žádný CR ve zdrojácích (nález B46, 14. 9. 2026). Soubor s CRLF vyřadí
      # statický hlídač XSS: test_escape.js si vytahuje esc()/escJs() ze zdroje
      # hledáním konce deklarace a v CRLF ho nenajde. Na Linuxu se to nestane
      # samo od sebe, ale commit s CRLF sem přijít může — a pak by hlídač
      # mlčel, aniž by kdokoli poznal, že neběží.
      - name: Žádné CRLF ve zdrojácích
        run: |
          if grep -rlI $'\r' src netlify *.mjs *.sh *.py *.toml; then
            echo "CHYBA: soubory výš mají CRLF. Repozitář má .gitattributes s eol=lf —"
            echo "spusťte 'git add --renormalize .' a commitněte."
            exit 1
          fi
          echo "Konce řádků v pořádku (LF)."

      - name: Sady v Node (jádro, UI, serverové funkce)
        run: bash ./spust_testy.sh

      - name: Sestavení (verze se přebírá z verze.txt a nezvyšuje se)
        env:
          KNG_NEZVYSOVAT_VERZI: '1'
        run: python3 build.py

      - name: Playwright (Chromium)
        run: |
          npm i -g playwright
          npx playwright install --with-deps chromium

      - name: Kouřový test sestavené aplikace (smoke.mjs)
        run: NODE_PATH="$(npm root -g)" node smoke.mjs

      - name: Online databáze — skutečný klient proti skutečným funkcím (overit_online.mjs)
        run: NODE_PATH="$(npm root -g)" node overit_online.mjs

      - name: Vypnutý řádek (V22) a zápis přepisu bez Enteru (N8) v prohlížeči (overit_vypnuty_radek.mjs)
        run: NODE_PATH="$(npm root -g)" node overit_vypnuty_radek.mjs

      - name: Obrazovka opláštění po stěnách (#268) v prohlížeči (overit_oplasteni.mjs)
        run: NODE_PATH="$(npm root -g)" node overit_oplasteni.mjs

      - name: Sestavený dist/ jako artefakt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 14

  # Mutační testování serverové vrstvy (netlify/mutace.mjs) — samostatný
  # job, protože pouští tři serverové sady znovu pro každou z ~100 mutací
  # a trvá řádově deset minut. Od 9. 9. 2026 hlídá i regresi nálezů auditu
  # B26–B31 a část B32: kdyby někdo kontrolu odstranil, testy by to musely
  # chytit — a tohle ověřuje, že by to opravdu chytily.
  #
  # Upřesněno 14. 9. 2026 (nález B55): starší srpnová sada mutací nesla čísla
  # B27–B31 z pořadníku 4. dávky a s čísly auditu se to pletlo. Ta starší je
  # od té chvíle L27–L31; čísla auditu zůstala, odkazuje na ně protokol
  # i roadmapa.
  mutace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ADMIN_EMAIL: spravce@priklad.cz
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Mutační testování serverové vrstvy (netlify/mutace.mjs)
        run: node netlify/mutace.mjs

  # Prohlížečové harnessy (nález N13, 14. 9. 2026). Do té doby jezdil v CI
  # jediný (overit_vypnuty_radek) a o tom, že se ostatní rozešly s aplikací,
  # se přišlo až při testovacím kole: overit_lista čekal rozměr, který nová
  # nabídka od v9.9.3 nemá, overit_atyp měřil ATYP nad prázdným formulářem
  # a overit_proj17 hledal částku, která se mezitím přestěhovala do ceníku.
  # Harness, který nikdo nepouští, není pojistka, ale falešný pocit jistoty.
  #
  # Vlastní job, protože každý harness startuje Chromium a dohromady to trvá
  # pár minut — do sad v Node to nepatří.
  harnessy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMIN_EMAIL: spravce@priklad.cz
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Sestavení (verze se přebírá z verze.txt)
        env:
          KNG_NEZVYSOVAT_VERZI: '1'
        run: python3 build.py
      # Playwright se instaluje MÍSTNĚ, ne globálně. `NODE_PATH` totiž platí
      # jen pro require() ze CommonJS — hledání modulů pro `import` ho ignoruje
      # úplně, takže harness končil na ERR_MODULE_NOT_FOUND. Ve starším jobu to
      # nikdo neodhalil, protože ty kroky nikdy nedoběhly: padalo už spouštění
      # sad o dva kroky výš (nález 14. 9. 2026 při zavádění tohohle jobu).
      - name: Playwright (Chromium)
        run: |
          npm i playwright
          npx playwright install --with-deps chromium
      - name: Lišta a historie (overit_lista.mjs)
        run: node overit_lista.mjs
      - name: ATYP a ceníkové podíly (overit_atyp.mjs)
        run: node overit_atyp.mjs
      - name: Detail výpočtu PROJ (overit_proj17.mjs)
        run: node overit_proj17.mjs
      - name: Matice zobrazení (overit_zobrazeni.mjs)
        run: node overit_zobrazeni.mjs
      # Průchod celou cestou OCK zakázky: založení → zadání → volitelné →
      # příplatky → nabídka → PDF (16. 9. 2026). Jednotkové sady ověřují
      # jednotlivé kroky; tenhle harness ověřuje MEZERY mezi nimi — tam byly
      # všechny tři závady, které J. V. ten den hlásil po sobě.
      - name: Celá cesta OCK zakázky (overit_ock_cela_cesta.mjs)
        run: node overit_ock_cela_cesta.mjs
