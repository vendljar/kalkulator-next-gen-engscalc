# Testy Kalkulátoru v cloudu (7. 9. 2026)
#
# Proč: na pracovním notebooku nejde z bezpečnostních důvodů instalovat Node
# ani Python, takže sady ze spust_testy.sh tam nikdy nepoběží. Kód už na
# GitHubu je a Netlify ho staví v cloudu — testy tedy běží tamtéž, na
# GitHub Actions, nad týmiž vynulovanými zdrojáky: žádný skutečný ceník
# (sady, které ho potřebují, se přeskočí s kódem 3 stejně jako lokálně),
# žádná tajemství (overit_online.mjs si nastavuje vlastní zkušební).
#
# Spouští se při každém pushi a pull requestu na main/test a ručně
# (GitHub → Actions → Testy → Run workflow). Výsledek: zelená/červená
# u commitu, podrobný výpis v záložce Actions, sestavený dist/ jako
# artefakt ke stažení. Nasazení na Netlify tím NENÍ podmíněné — Netlify
# staví dál sám; tohle je nezávislá kontrola.
name: Testy

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'   # stejná verze jako NODE_VERSION v netlify.toml

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Konvence vDEN.MĚSÍC.pořadí (10. 9. 2026). Na pracovním notebooku nejde
      # spustit Python, takže se verze.txt píše ručně a pojistka uvnitř build.py
      # se nikdy nespustí — čtyři dávky z 10. září odešly jako 9.9.x. Tenhle
      # krok je ten chybějící článek: měří verzi proti datu posledního commitu.
      - name: Verze odpovídá dni commitu (vDEN.MĚSÍC.pořadí)
        run: python3 build.py --kontrola-verze

      - name: Sady v Node (jádro, UI, serverové funkce)
        run: bash ./spust_testy.sh

      - name: Sestavení (verze se přebírá z verze.txt a nezvyšuje se)
        env:
          KNG_NEZVYSOVAT_VERZI: '1'
        run: python3 build.py

      - name: Playwright (Chromium)
        run: |
          npm i -g playwright
          npx playwright install --with-deps chromium

      - name: Kouřový test sestavené aplikace (smoke.mjs)
        run: NODE_PATH="$(npm root -g)" node smoke.mjs

      - name: Online databáze — skutečný klient proti skutečným funkcím (overit_online.mjs)
        run: NODE_PATH="$(npm root -g)" node overit_online.mjs

      - name: Vypnutý řádek (V22) a zápis přepisu bez Enteru (N8) v prohlížeči (overit_vypnuty_radek.mjs)
        run: NODE_PATH="$(npm root -g)" node overit_vypnuty_radek.mjs

      - name: Sestavený dist/ jako artefakt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 14

  # Mutační testování serverové vrstvy (netlify/mutace.mjs) — samostatný
  # job, protože pouští tři serverové sady znovu pro každou z ~100 mutací
  # a trvá řádově deset minut. Od 9. 9. 2026 hlídá i regresi nálezů B26–B32:
  # kdyby někdo kontrolu odstranil, testy by to musely chytit — a tohle
  # ověřuje, že by to opravdu chytily.
  mutace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Mutační testování serverové vrstvy (netlify/mutace.mjs)
        run: node netlify/mutace.mjs
