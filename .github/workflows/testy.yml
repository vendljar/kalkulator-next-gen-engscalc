# Testy Kalkulátoru v cloudu (7. 9. 2026; od 26. 9. 2026 přes testovaci_kolo.sh)
#
# Proč: na pracovním notebooku nejde z bezpečnostních důvodů instalovat Node
# ani Python, takže sady tam nikdy nepoběží. Kód už na GitHubu je a Netlify
# ho staví v cloudu — testy tedy běží tamtéž, na GitHub Actions, nad týmiž
# vynulovanými zdrojáky: žádný skutečný ceník (sady, které ho potřebují, se
# přeskočí s kódem 3 stejně jako lokálně), žádná tajemství (harnessy si
# nastavují vlastní zkušební), žádné firemní šablony (harnessy, které je
# potřebují, se hlásí jako přeskočené s kódem 4).
#
# OD 24. 9. 2026 (rozhodnutí J. V.) SE SPOUŠTÍ AUTOMATICKY JEN PŘI PUSHI NA
# MAIN a ručně (GitHub → Actions → Testy → Run workflow). Před pushem na
# test-draft/test pouští tytéž kroky nastroje/pred_pushem.sh v cloudovém
# sezení. Nasazení na Netlify tím NENÍ podmíněné — Netlify staví dál sám.
#
# JEDINÝ SEZNAM KROKŮ JE V nastroje/testovaci_kolo.sh (A5, 26. 9. 2026).
# Do té doby tu byl vlastní výčet kroků a vlastní smyčka přes harnessy —
# a dvakrát se rozešel s tím, co se pouštělo lokálně (N16, 22. 9. 2026:
# 27 harnessů osm dní nikde neběželo). Tady se jen volá ten skript:
#   job „testy"          = testovaci_kolo.sh --bez-mutaci
#                          (sestavení, všechny sady v Node i na serveru,
#                          smoke + VŠECHNY overit_*.mjs globem, statické
#                          kontroly: verze = den commitu, CRLF, osobní údaje
#                          a tajemství)
#   job „mutace-server"  = testovaci_kolo.sh --jen mutace-server, matrix 10 částí
#   job „mutace-jadro"   = testovaci_kolo.sh --jen mutace-jadro, matrix 3 části
# Mutace běží v samostatných jobech, aby jely souběžně. OD 23. 10. 2026 (P2,
# podklady/PROMPT_mutacni_beh_23_10.md) PO ČÁSTECH: celý běh se do jednoho
# jobu nevešel (Testy #194: server ~280 z 808 za 45 min, jádro taky
# nedoběhlo). Část K/N = každá N-tá mutace od K-té (KNG_MUTACE_CAST,
# nastroje/mutace_cast.mjs); části dohromady pokryjí každou mutaci právě
# jednou. Celé kolo = všechny joby matrixu zelené. Testy #195 (23. 10. 2026):
# server v 6 částech po ~150 mutacích — 5 z 6 zrušil limit 75 min (nejrychlejší
# část 63 min); od 24. 10. (#514) 10 částí po ~92 mutacích, limit 90 min. Přeskočené sady vypíše souhrn skriptu; přeskočená kontrola,
# o které se mlčí, je totéž co kontrola, která neexistuje.
name: Testy

on:
  push:
    branches: [main]
  workflow_dispatch:

# B125 (audit 2. 10. 2026): workflow jen čte repozitář — token GITHUB_TOKEN
# nesmí víc. Akce jsou připnuté na celý SHA commitu (značka v komentáři):
# značka se dá přesunout, SHA ne. Playwright má pevnou verzi, aby CI
# nestahovalo pokaždé jinou (stejná verze jako v cloudovém sezení).
# Checkout bez uložených přihlašovacích údajů (SEC-N7, #514): workflow nic
# nepushuje, token tedy nemusí ležet v .git/config, když se instaluje cizí
# balíček (Playwright). Zámek balíčku s integritou (ci/package-lock.json)
# čeká — vyrobit ho jde jen s přístupem k registru npm (PREDAVKA).
permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-24.04  # pevně: ubuntu-latest = 26.04 od 19. 10. 2026, Playwright tam Chromium neinstaluje
    timeout-minutes: 45
    # Adresa hlavního správce se bere z proměnné prostředí, ne z konstanty
    # v repozitáři (ten je veřejný). Testům stačí SMYŠLENÁ adresa — ověřují
    # pravidla, ne konkrétní účet. Ostrý i testovací web mají svou v Netlify.
    env:
      ADMIN_EMAIL: spravce@priklad.cz
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # SEC-N7 (#514): token nezůstane v .git/config při instalaci balíčků

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.2'   # stejná verze jako NODE_VERSION v netlify.toml

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # Playwright se instaluje MÍSTNĚ, ne globálně: `NODE_PATH` platí jen pro
      # require() ze CommonJS, hledání modulů pro `import` ho ignoruje (nález
      # 14. 9. 2026). Místní node_modules/playwright vidí obě cesty.
      - name: Playwright (Chromium)
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Testovací kolo bez mutací (sestavení, sady, harnessy, statické kontroly)
        run: bash nastroje/testovaci_kolo.sh --bez-mutaci

      - name: Sestavený dist/ jako artefakt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 14

  # Mutační testování serverové vrstvy (netlify/mutace.mjs): pouští serverové
  # sady znovu pro každou z ~190 mutací. Od 9. 9. 2026 hlídá i regresi nálezů
  # auditu: kdyby někdo kontrolu odstranil, testy by to musely chytit — tohle
  # ověřuje, že by to opravdu chytily. Rychlá kontrola zadání (--kontrola)
  # běží už v jobu „testy" uvnitř spust_testy.sh.
  # Časy (Testy #195, 23. 10. 2026, změřeno): ~150 mutací na část trvalo
  # 63 min a víc (5 z 6 částí zrušil limit 75 min) → ~0,45 min na mutaci.
  # 917 / 10 ≈ 92 mutací ≈ 40–60 min na část; limit 90 min = rezerva ~50 %
  # i na další růst. Při ~1100 mutacích přidat části (K8-W7).
  mutace-server:
    runs-on: ubuntu-24.04  # pevně: ubuntu-latest = 26.04 od 19. 10. 2026, Playwright tam Chromium neinstaluje
    timeout-minutes: 90
    strategy:
      fail-fast: false   # jedna červená část nesmí zrušit ostatní — chceme vidět všechny nechycené
      matrix:
        cast: ['1/10', '2/10', '3/10', '4/10', '5/10', '6/10', '7/10', '8/10', '9/10', '10/10']
    name: mutace-server (část ${{ matrix.cast }})
    env:
      ADMIN_EMAIL: spravce@priklad.cz
      KNG_MUTACE_CAST: ${{ matrix.cast }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # SEC-N7 (#514): token nezůstane v .git/config při instalaci balíčků
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.2'
      - name: Mutace serveru (netlify/mutace.mjs)
        run: bash nastroje/testovaci_kolo.sh --jen mutace-server

  # Mutační testování VÝPOČETNÍHO JÁDRA (nález N19, 23. 9. 2026): mutace_jadro.mjs
  # pouští sady, které se na jádro odkazují, pro každou ze ~76 mutací.
  # 527 / 3 ≈ 176 mutací na část; limit 75 min (celé jádro se do 45 min nevešlo).
  mutace-jadro:
    runs-on: ubuntu-24.04  # pevně: ubuntu-latest = 26.04 od 19. 10. 2026, Playwright tam Chromium neinstaluje
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        cast: ['1/3', '2/3', '3/3']
    name: mutace-jadro (část ${{ matrix.cast }})
    env:
      KNG_MUTACE_CAST: ${{ matrix.cast }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # SEC-N7 (#514): token nezůstane v .git/config při instalaci balíčků
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.2'
      - name: Mutace jádra (mutace_jadro.mjs)
        run: bash nastroje/testovaci_kolo.sh --jen mutace-jadro
