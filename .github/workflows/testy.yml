# Testy Kalkulátoru v cloudu (7. 9. 2026; od 26. 9. 2026 přes testovaci_kolo.sh)
#
# Proč: na pracovním notebooku nejde z bezpečnostních důvodů instalovat Node
# ani Python, takže sady tam nikdy nepoběží. Kód už na GitHubu je a Netlify
# ho staví v cloudu — testy tedy běží tamtéž, na GitHub Actions, nad týmiž
# vynulovanými zdrojáky: žádný skutečný ceník (sady, které ho potřebují, se
# přeskočí s kódem 3 stejně jako lokálně), žádná tajemství (harnessy si
# nastavují vlastní zkušební), žádné firemní šablony (harnessy, které je
# potřebují, se hlásí jako přeskočené s kódem 4).
#
# OD 24. 9. 2026 (rozhodnutí J. V.) SE SPOUŠTÍ AUTOMATICKY JEN PŘI PUSHI NA
# MAIN a ručně (GitHub → Actions → Testy → Run workflow). Před pushem na
# test-draft/test pouští tytéž kroky nastroje/pred_pushem.sh v cloudovém
# sezení. Nasazení na Netlify tím NENÍ podmíněné — Netlify staví dál sám.
#
# JEDINÝ SEZNAM KROKŮ JE V nastroje/testovaci_kolo.sh (A5, 26. 9. 2026).
# Do té doby tu byl vlastní výčet kroků a vlastní smyčka přes harnessy —
# a dvakrát se rozešel s tím, co se pouštělo lokálně (N16, 22. 9. 2026:
# 27 harnessů osm dní nikde neběželo). Tady se jen volá ten skript:
#   job „testy"          = testovaci_kolo.sh --bez-mutaci
#                          (sestavení, všechny sady v Node i na serveru,
#                          smoke + VŠECHNY overit_*.mjs globem, statické
#                          kontroly: verze = den commitu, CRLF, osobní údaje
#                          a tajemství)
#   job „mutace-server"  = testovaci_kolo.sh --jen mutace-server
#   job „mutace-jadro"   = testovaci_kolo.sh --jen mutace-jadro
# Mutace běží v samostatných jobech, aby jely souběžně — každý trvá kolem
# dvaceti minut. Přeskočené sady vypíše souhrn skriptu; přeskočená kontrola,
# o které se mlčí, je totéž co kontrola, která neexistuje.
name: Testy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Adresa hlavního správce se bere z proměnné prostředí, ne z konstanty
    # v repozitáři (ten je veřejný). Testům stačí SMYŠLENÁ adresa — ověřují
    # pravidla, ne konkrétní účet. Ostrý i testovací web mají svou v Netlify.
    env:
      ADMIN_EMAIL: spravce@priklad.cz
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'   # stejná verze jako NODE_VERSION v netlify.toml

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Playwright se instaluje MÍSTNĚ, ne globálně: `NODE_PATH` platí jen pro
      # require() ze CommonJS, hledání modulů pro `import` ho ignoruje (nález
      # 14. 9. 2026). Místní node_modules/playwright vidí obě cesty.
      - name: Playwright (Chromium)
        run: |
          npm i playwright
          npx playwright install --with-deps chromium

      - name: Testovací kolo bez mutací (sestavení, sady, harnessy, statické kontroly)
        run: bash nastroje/testovaci_kolo.sh --bez-mutaci

      - name: Sestavený dist/ jako artefakt
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 14

  # Mutační testování serverové vrstvy (netlify/mutace.mjs): pouští serverové
  # sady znovu pro každou z ~190 mutací. Od 9. 9. 2026 hlídá i regresi nálezů
  # auditu: kdyby někdo kontrolu odstranil, testy by to musely chytit — tohle
  # ověřuje, že by to opravdu chytily. Rychlá kontrola zadání (--kontrola)
  # běží už v jobu „testy" uvnitř spust_testy.sh.
  mutace-server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ADMIN_EMAIL: spravce@priklad.cz
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Mutace serveru (netlify/mutace.mjs)
        run: bash nastroje/testovaci_kolo.sh --jen mutace-server

  # Mutační testování VÝPOČETNÍHO JÁDRA (nález N19, 23. 9. 2026): mutace_jadro.mjs
  # pouští sady, které se na jádro odkazují, pro každou ze ~76 mutací.
  mutace-jadro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Mutace jádra (mutace_jadro.mjs)
        run: bash nastroje/testovaci_kolo.sh --jen mutace-jadro
